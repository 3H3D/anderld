<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANDER — Official Artist Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background-color: #000000; color: #ffffff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; line-height: 1.6; }
    body { background-color: #000000; color: #ffffff; }
    a { color: inherit; text-decoration: none; }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.5rem 2.5rem; background: #000000;
      border-bottom: 1px solid #222222;
    }
    .artist-mark { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.25em; }
    .menu-items { display: flex; gap: 2.5rem; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.18em; color: #888888; }
    .menu-items a:hover, .menu-items a.active { color: #ffffff; text-decoration: underline; text-underline-offset: 5px; }

    /* Layout Full Screen Tanpa Garis Tengah */
    .split-layout { display: grid; grid-template-columns: 45% 55%; min-height: 100vh; padding-top: 70px; }
    
    .artist-visual {
      position: sticky; top: 70px; height: calc(100vh - 70px);
      background-color: #111111; background-size: cover; background-position: center;
      display: flex; align-items: flex-end; padding: 3rem;
    }
    .visual-tint { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.4) 100%); z-index: 1; }
    .visual-caption { position: relative; z-index: 2; width: 100%; }
    
    .label-badge { display: inline-block; background: #ffffff; color: #000000; font-size: 0.68rem; font-weight: 900; letter-spacing: 0.18em; padding: 0.25rem 0.6rem; margin-bottom: 1rem; }
    .main-title { font-size: clamp(3.5rem, 6vw, 5.5rem); font-weight: 900; letter-spacing: 0.04em; line-height: 0.95; margin-bottom: 0.3rem; }
    .tagline { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.18em; color: #cccccc; margin-bottom: 1.75rem; }

    /* Tombol / Button Sosial Media & Toko Musik yang Tegas */
    .artist-socials {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .btn-social {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      padding: 0.65rem 1.1rem;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.14em;
      transition: all 0.2s;
    }
    .btn-social:hover {
      background: #000000;
      color: #ffffff;
    }

    /* Sisi Kanan Dibuat Bersih Kosong Elegan */
    .content-stream { padding: 5rem 4.5rem; background-color: #000000; display: flex; flex-direction: column; justify-content: space-between; }
    
    .stream-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; color: #555555; margin-top: auto; }

    @media (max-width: 960px) {
      .nav-home { display: none; }
      .split-layout { grid-template-columns: 1fr; }
      .artist-visual { position: relative; top: 0; height: 65vh; padding: 2rem 1.5rem; }
      .content-stream { padding: 3rem 1.5rem; min-height: 35vh; }
      .top-bar { padding: 1.25rem 1.5rem; }
      .menu-items { gap: 1.25rem; }
    }
  </style>
</head>
<body id="home">

  <header class="top-bar">
    <a href="index.html" class="artist-mark">ANDER</a>
    <nav class="menu-items">
      <a href="index.html" class="nav-home active">HOME</a>
      <a href="music.html">MUSIC</a>
      <a href="video.html">VIDEO</a>
      <a href="join.html">JOIN</a>
    </nav>
  </header>

  <div class="split-layout">
    <aside class="artist-visual" id="artistVisual">
      <div class="visual-tint"></div>
      <div class="visual-caption">
        <span class="label-badge">FERWAP MUSIC ENTERTAINMENT</span>
        <h1 class="main-title">ANDER</h1>
        <p class="tagline">SINGER &bull; SONGWRITER &bull; INDEPENDENT</p>
        
        <!-- Tombol Sosial Media & Toko Musik -->
        <div class="artist-socials">
          <a href="https://open.spotify.com" target="_blank" rel="noopener" class="btn-social">SPOTIFY</a>
          <a href="https://music.apple.com" target="_blank" rel="noopener" class="btn-social">APPLE MUSIC</a>
          <a href="https://music.youtube.com" target="_blank" rel="noopener" class="btn-social">YOUTUBE</a>
          <a href="https://instagram.com" target="_blank" rel="noopener" class="btn-social">INSTAGRAM</a>
        </div>
      </div>
    </aside>

    <main class="content-stream">
      <div></div> <!-- Ruang kosong agar bersih minimalis -->

      <footer class="stream-footer">
        <span>&copy; <span id="year"></span> ANDER. ALL RIGHTS RESERVED.</span>
        <span>FERWAP MUSIC ENTERTAINMENT</span>
      </footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://PROJECT_ID_ANDA.supabase.co";
    const SUPABASE_ANON_KEY = "SUPABASE_ANON_PUBLIC_KEY_ANDA";
    const supabaseClient = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PROJECT_ID_ANDA") ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    document.getElementById("year").textContent = new Date().getFullYear();

    async function initHome() {
      if (!supabaseClient) return;
      const { data } = await supabaseClient.from("artist_releases").select("*").eq("artist_slug", "ander").eq("is_published", true).eq("is_featured", true).single();
      if (data && data.cover_url) {
        document.getElementById("artistVisual").style.backgroundImage = `url('${encodeURI(data.cover_url)}')`;
      }
    }
    initHome();
  </script>
</body>
</html>
