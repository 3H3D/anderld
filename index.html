<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANDER — Official Artist Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background-color: #000000; color: #ffffff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; line-height: 1.6; }
    body { background-color: #000000; color: #ffffff; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }

    /* Top Bar */
    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.5rem 2.5rem; background: #000000;
      border-bottom: 1px solid #1a1a1a;
    }
    .artist-mark { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.25em; }
    .menu-items { display: flex; gap: 2.5rem; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.18em; color: #777777; }
    .menu-items a:hover, .menu-items a.active { color: #ffffff; text-decoration: underline; text-underline-offset: 5px; }

    /* Halaman Penuh Hitam Pekat & Posisi di Tengah */
    .full-screen-center {
      min-height: 100vh;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: calc(70px + 4rem) 2.5rem 3rem;
    }

    .center-box {
      margin: auto 0;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .label-badge {
      display: inline-block; background: #ffffff; color: #000000;
      font-size: 0.68rem; font-weight: 900; letter-spacing: 0.18em;
      padding: 0.25rem 0.6rem; margin-bottom: 1.25rem;
    }

    .main-title {
      font-size: clamp(4rem, 9vw, 7.5rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 0.95;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #cccccc;
      margin-bottom: 2rem;
    }

    /* Ikon Sosial Media Murni (Tanpa Tombol/Kotak) */
    .artist-socials {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.75rem;
    }

    .icon-social {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #aaaaaa;
      transition: color 0.2s, transform 0.2s;
    }

    .icon-social svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .icon-social:hover {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .stream-footer {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #555555;
    }

    @media (max-width: 960px) {
      .nav-home { display: none; }
      .full-screen-center { padding: calc(70px + 2rem) 1.5rem 2rem; }
      .top-bar { padding: 1.25rem 1.5rem; }
      .menu-items { gap: 1.25rem; }
    }
  </style>
</head>
