<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANDER — Music Catalog</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background-color: #000000; color: #ffffff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; line-height: 1.6; }
    body { background-color: #000000; color: #ffffff; }
    a { color: inherit; text-decoration: none; }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.5rem 2.5rem; background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(8px); border-bottom: 1px solid #ffffff;
    }
    .artist-mark { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.25em; }
    .menu-items { display: flex; gap: 2.5rem; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.18em; color: #aaaaaa; }
    .menu-items a:hover, .menu-items a.active { color: #ffffff; text-decoration: underline; text-underline-offset: 5px; }

    .main-container { max-width: 900px; margin: 0 auto; padding: 8rem 2rem 5rem; }
    .page-title { font-size: 2rem; font-weight: 900; letter-spacing: 0.2em; margin-bottom: 3rem; border-bottom: 1px solid #ffffff; padding-bottom: 1rem; }

    .catalog-list { display: flex; flex-direction: column; }
    .track-item { display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 0; border-bottom: 1px solid #333333; gap: 1rem; }
    .track-left { display: flex; align-items: center; gap: 1.5rem; }
    .track-thumb { width: 64px; height: 64px; background-color: #141414; background-size: cover; background-position: center; border: 1px solid #ffffff; display: grid; place-items: center; font-size: 0.7rem; font-weight: 900; flex-shrink: 0; }
    .track-details h4 { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
    .track-details span { font-size: 0.8rem; color: #888888; font-weight: 600; }
    .track-dsps { display: flex; gap: 1.25rem; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.12em; color: #aaaaaa; }
    .track-dsps a:hover { color: #ffffff; text-decoration: underline; }

    .stream-footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; color: #777777; margin-top: 6rem; border-top: 1px solid #333; padding-top: 2rem; }

    @media (max-width: 768px) {
      .track-item { flex-direction: column; align-items: flex-start; }
      .top-bar { padding: 1.25rem 1.5rem; }
      .menu-items { gap: 1.25rem; }
      .main-container { padding: 7rem 1.5rem 4rem; }
    }
  </style>
</head>
<body id="music-page">

  <header class="top-bar">
    <a href="index.html" class="artist-mark">ANDER</a>
    <nav class="menu-items">
      <a href="index.html" class="nav-home">HOME</a>
      <a href="music.html" class="active">MUSIC</a>
      <a href="video.html">VIDEO</a>
      <a href="join.html">JOIN</a>
    </nav>
  </header>

  <main class="main-container">
    <h1 class="page-title">MUSIC</h1>
    
    <div class="catalog-list" id="catalogList">
      <p style="color: #888; font-size: 0.9rem;">Memuat katalog rilisan...</p>
    </div>

     <!-- Footer yang Telah Dirapikan -->
    <footer class="site-footer">
      <p class="copyright">&copy; <span id="year">2026</span> Ferwap Music Entertainment. All Rights Reserved.</p>
      <div class="footer-links">
        <a href="https://ferwap.com/privacy">Privacy Policy</a> | 
        <a href="https://ferwap.com/terms">Terms of Service</a> | 
        <a href="https://ferwap.com/copyright">Copyright</a>
      </div>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://PROJECT_ID_ANDA.supabase.co";
    const SUPABASE_ANON_KEY = "SUPABASE_ANON_PUBLIC_KEY_ANDA";
    const supabaseClient = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PROJECT_ID_ANDA") ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const fallbackReleases = [
      { id: "1", title: "TORU RE", release_type: "Single", release_year: "2026", spotify_url: "https://open.spotify.com", apple_url: "https://music.apple.com", youtube_url: "https://music.youtube.com" },
      { id: "2", title: "Kwiregtori", release_type: "Single", release_year: "2026", spotify_url: "https://open.spotify.com", apple_url: "https://music.apple.com", youtube_url: "https://music.youtube.com" },
      { id: "3", title: "Sogdai Ya", release_type: "Single", release_year: "2026", spotify_url: "https://open.spotify.com", apple_url: "https://music.apple.com", youtube_url: "https://music.youtube.com" }
    ];

    document.getElementById("year").textContent = new Date().getFullYear();

    async function initMusic() {
      let releases = fallbackReleases;
      if (supabaseClient) {
        const { data } = await supabaseClient.from("artist_releases").select("*").eq("artist_slug", "ander").eq("is_published", true).order("sort_order", { ascending: true });
        if (data && data.length > 0) releases = data;
      }

      document.getElementById("catalogList").innerHTML = releases.map(item => {
        const thumbStyle = item.cover_url ? `style="background-image: url('${encodeURI(item.cover_url)}')"` : "";
        const thumbLabel = item.cover_url ? "" : "ANDER";
        const links = [];
        if (item.spotify_url) links.push(`<a href="${item.spotify_url}" target="_blank" rel="noopener">SPOTIFY</a>`);
        if (item.apple_url) links.push(`<a href="${item.apple_url}" target="_blank" rel="noopener">APPLE</a>`);
        if (item.youtube_url) links.push(`<a href="${item.youtube_url}" target="_blank" rel="noopener">YOUTUBE</a>`);

        return `
          <div class="track-item">
            <div class="track-left">
              <div class="track-thumb" ${thumbStyle}>${thumbLabel}</div>
              <div class="track-details">
                <h4>${item.title}</h4>
                <span>${item.release_type || "Single"} &bull; ${item.release_year || "2026"}</span>
              </div>
            </div>
            <div class="track-dsps">${links.join("")}</div>
          </div>
        `;
      }).join("");
    }
    initMusic();
  </script>
</body>
</html>
