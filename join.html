<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANDER — Join Mailing List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background-color: #000000; color: #ffffff; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; line-height: 1.6; }
    body { background-color: #000000; color: #ffffff; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }

    .top-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.5rem 2.5rem; background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(8px); border-bottom: 1px solid #1a1a1a;
    }
    .artist-mark { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.25em; }
    .menu-items { display: flex; gap: 2.5rem; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.18em; color: #aaaaaa; }
    .menu-items a:hover, .menu-items a.active { color: #ffffff; text-decoration: underline; text-underline-offset: 5px; }

    .main-container { max-width: 700px; margin: 0 auto; padding: 9rem 2rem 5rem; }
    .page-title { font-size: 2rem; font-weight: 900; letter-spacing: 0.2em; margin-bottom: 1.5rem; }
    .join-desc { color: #cccccc; margin-bottom: 2.5rem; font-size: 1rem; line-height: 1.7; }

    .subscribe-form { display: flex; border: 1px solid #ffffff; margin-bottom: 2rem; }
    .subscribe-form input { flex: 1; background: #000000; border: none; color: #ffffff; padding: 1.1rem 1.25rem; font-size: 0.9rem; outline: none; }
    .subscribe-form input::placeholder { color: #777777; letter-spacing: 0.08em; }
    .subscribe-form button { background: #ffffff; color: #000000; border: none; padding: 1.1rem 2rem; font-size: 0.78rem; font-weight: 900; letter-spacing: 0.18em; transition: opacity 0.2s; }
    .subscribe-form button:hover { opacity: 0.85; }
    .subscribe-feedback { margin-top: -1rem; margin-bottom: 2rem; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.08em; color: #ffffff; min-height: 1.5rem; }

    /* Footer Terstruktur Rapi */
    .site-footer {
      border-top: 1px solid #333333;
      padding-top: 2rem;
      margin-top: 6rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      color: #777777;
      align-items: center;
    }
    .footer-links a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .subscribe-form { flex-direction: column; border: none; }
      .subscribe-form input { border: 1px solid #ffffff; margin-bottom: 1rem; }
      .subscribe-form button { width: 100%; }
      .top-bar { padding: 1.25rem 1.5rem; }
      .menu-items { gap: 1.25rem; }
      .main-container { padding: 7rem 1.5rem 4rem; }
      .site-footer { flex-direction: column; text-align: center; gap: 0.75rem; }
    }
  </style>
</head>
<body id="join-page">

  <header class="top-bar">
    <a href="index.html" class="artist-mark">ANDER</a>
    <nav class="menu-items">
      <a href="index.html" class="nav-home">HOME</a>
      <a href="music.html">MUSIC</a>
      <a href="video.html">VIDEO</a>
      <a href="join.html" class="active">JOIN</a>
    </nav>
  </header>

  <main class="main-container">
    <h1 class="page-title">JOIN</h1>
    <p class="join-desc"></p>
    
    <form class="subscribe-form" id="subscribeForm">
      <input type="email" id="subscriberEmail" placeholder="ALAMAT EMAIL ANDA" required />
      <button type="submit" id="subscribeBtn">SUBSCRIBE</button>
    </form>
    <p class="subscribe-feedback" id="subscribeFeedback"></p>

    <!-- Footer yang Telah Dirapikan -->
    <footer class="site-footer">
      <p class="copyright">&copy; <span id="year">2026</span> Ferwap Music Entertainment. All Rights Reserved.</p>
      <div class="footer-links">
        <a href="https://ferwap.com/privacy">Privacy Policy</a> | 
        <a href="https://ferwap.com/terms">Terms of Service</a> | 
        <a href="https://ferwap.com/copyright">Copyright</a>
      </div>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://PROJECT_ID_ANDA.supabase.co";
    const SUPABASE_ANON_KEY = "SUPABASE_ANON_PUBLIC_KEY_ANDA";
    const supabaseClient = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PROJECT_ID_ANDA") ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const yearEl = document.getElementById("year");
    if (yearEl) {
      yearEl.textContent = new Date().getFullYear();
    }

    const subscribeForm = document.getElementById("subscribeForm");
    const subscriberEmail = document.getElementById("subscriberEmail");
    const subscribeBtn = document.getElementById("subscribeBtn");
    const subscribeFeedback = document.getElementById("subscribeFeedback");

    subscribeForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = subscriberEmail.value.trim();
      if (!email) return;

      subscribeBtn.disabled = true;
      subscribeBtn.textContent = "SAVING...";
      subscribeFeedback.textContent = "";

      if (supabaseClient) {
        const { error } = await supabaseClient.from("artist_subscribers").insert([{ artist_slug: "ander", email }]);
        if (error && error.code !== "23505") {
          subscribeFeedback.textContent = "GAGAL MENDAFTAR. SILAKAN COBA LAGI.";
        } else {
          subscribeFeedback.textContent = "TERIMA KASIH. EMAIL ANDA TELAH TERDAFTAR.";
          subscriberEmail.value = "";
        }
      } else {
        subscribeFeedback.textContent = "TERIMA KASIH. EMAIL ANDA TELAH TERDAFTAR.";
        subscriberEmail.value = "";
      }

      subscribeBtn.disabled = false;
      subscribeBtn.textContent = "SUBSCRIBE";
    });
  </script>
</body>
</html>
